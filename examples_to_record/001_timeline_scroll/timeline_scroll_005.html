<!doctype html>
<html>
    <head>
        <style>
            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                padding: 0;
                scrollbar-width: none;
            }

            .wrap {
                background: #f7f7f6;
                display: flex;
                flex-direction: column;
                gap: 4lh;
                align-items: center;
                padding: 4lh;
            }

            .box {
                background: #0a2431;
                height: 205px;
                width: 100%;
                border-radius: 5px;
            }

            h1 {
                font-family: Arial, Helvetica, sans-serif;
                font-size: var(--font-size);
                text-shadow: 2px 2px 3px #00000082;
                color: #f7f7f6;
            }

            @property --font-size {
                syntax: "<length>";
                inherits: true;
                initial-value: 94px;
            }

            header {
                width: 100%;
                background: #29b9fe;
                overflow: hidden;
                padding: 4lh;
                padding-top: 2em;
                padding-bottom: 2em;
                position: fixed;
                top: 0;

                animation-name: padding-shrink;
                animation-timeline: scroll();
                animation-timing-function: linear;
                animation-fill-mode: both;
                animation-range-end: 30%;
            }

            @keyframes padding-shrink {
                to {
                    padding-top: 0.3em;
                    padding-bottom: 0.3em;
                    --font-size: 40px;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Timeline Scroll</h1>
        </header>

        <div class="wrap">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <script>
            window.scrollTo({
                top: document.body.getBoundingClientRect().height,
                left: 0,
                behavior: "smooth",
            });

            setTimeout(() => {
                window.scrollTo({
                    top: 0,
                    left: 0,
                    behavior: "smooth",
                });
            }, 2000);
        </script>
    </body>
</html>
